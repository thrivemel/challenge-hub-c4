<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Challenge Hub | Book 5 Consults in 5 Days Challenge</title>
<meta name="description" content="Watch each day's session, get today's Quest, and grab your Playbook.">
<link rel="icon" href="https://d2saw6je89goi1.cloudfront.net/uploads/digital_asset/file/664695/THRIVE_FAVICON_CROP_4_FA.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Raleway:wght@200;300;400;500;600&display=swap">

<style>
/* ============================================================
   Thrive Challenge Hub
   Built to Thrive Brand Guidelines 2024.
   Raleway = primary family. Oswald = accent, used sparingly.
   Buttons #1D74BD on light. 90 degree corners everywhere.
   No dark navy grounds (Sharla, Aug 2026). Navy is type only.
   ============================================================ */
:root{
  /* Palette sampled off the Client Attraction Summit banner and the live site.
     Navy is a BAND and a type colour. It is never a background field. */
  --delft:#1A325C; --ink:#1A325C; --cerulean:#016D92; --indigo:#044470;
  --teal:#298EA5; --sky:#00AEEF;
  --btn:#1D74BD; --btn-hover:#17629F;
  --header:#019ACD; --body:#5C6570; --soft:#8A939E;
  --ground:#DAD6DA; --ground-soft:#EFEDEF;
  --line:#E3E7EB; --hair:#EDF0F3; --locked-bg:#F1F2F4; --locked-ink:#A8B0B8;
  --grad-gold:linear-gradient(90deg,#9D6903,#FDD276 35%,#875300 55%,#D6B146 78%,#DAB044);
  --gold:#D6B146; --ok:#0F7B4F; --orange:#F16736;
  --shell:#F4F4F5;
  --measure:68ch;
  --band-h:48px;

  /* TYPE SCALE. Steps are ~1.28-1.5 apart so each one does real work.
     Before this there were six sizes between 11 and 14px doing none. */
  --t-display:clamp(34px,4.4vw,52px);   /* h1            Raleway 200 */
  --t-title:clamp(24px,2.7vw,34px);     /* h2.sub        Raleway 200 */
  --t-lede:clamp(17px,1.4vw,19px);      /* intro para    Raleway 300 */
  --t-body:16.5px;                      /* reading text  Raleway 400 */
  --t-small:14px;                       /* captions      Raleway 400 */
  --t-micro:12px;                       /* labels        Oswald 300  */
  --lh-tight:1.08;
  --lh-snug:1.35;
  --lh-body:1.62;

  /* LABEL TRACKING, one value per role instead of six.
     Oswald uppercase wants roughly .5em; the live site runs .69em on
     eyebrows, which is where the brand's airiness comes from. */
  --ls-eyebrow:.62em;
  --ls-label:.42em;
  --ls-btn:.34em;
  --ls-micro:.24em;
}
*{box-sizing:border-box;border-radius:0}
b,strong{font-weight:600}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--shell);color:var(--body);
  font-family:Raleway,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--t-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;
}
a{color:var(--btn)}
:focus-visible{outline:3px solid var(--header);outline-offset:2px}
img{max-width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--btn);padding:12px 18px;z-index:100}
.skip:focus{left:8px;top:8px}

/* ---------- review tools (delete this whole block before launch) ---------- */
#rev{position:fixed;right:14px;bottom:14px;z-index:70;font-family:Oswald,Impact,sans-serif;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;
  align-items:flex-end;gap:8px}
#revToggle{font:inherit;background:#fff;color:#6B7A8A;border:1px solid #C4CED8;padding:7px 11px;
  cursor:pointer;box-shadow:0 2px 10px rgba(0,24,38,.10)}
#revToggle:hover{color:var(--btn);border-color:var(--btn)}
#revPanel{background:#fff;border:1px solid #C4CED8;box-shadow:0 8px 30px rgba(0,24,38,.16);
  padding:13px 14px;max-width:260px}
#revPanel[hidden]{display:none}
#revPanel .lbl{display:block;color:#9AA7B4;margin:0 0 5px}
#revPanel .lbl+.lbl{margin-top:12px}
#revPanel .row{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
#revPanel button{font:inherit;background:#fff;color:#4A5A6B;border:1px solid #C4CED8;
  padding:5px 8px;cursor:pointer}
#revPanel button:hover{border-color:var(--btn);color:var(--btn)}
#revPanel button[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
#revPanel .wide{width:100%;margin-top:6px}
#revPanel .note{display:block;text-transform:none;letter-spacing:0;font-family:Raleway,Arial,sans-serif;
  font-size:11px;color:#9AA7B4;line-height:1.45;margin:12px 0 0}

/* ---------- masthead ---------- */
.masthead{background:linear-gradient(168deg,#E9E7E9 0%,var(--ground) 100%);position:relative;overflow:hidden}
.masthead .in{max-width:1200px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;position:relative;z-index:3}
.masthead .logo{width:102px}
/* the navy band: the device carried over from the Summit banner */
/* ---------- welcome page ----------
   Proportions taken from the Summit banner: the pair are large and grounded,
   running the full height and cropped by the frame, with the navy band crossing
   their lower third. Type sits tight between them. Very little dead space. */
body.is-login .side,body.is-login .strip{display:none}
body.is-login .shell{max-width:none;grid-template-columns:1fr;background:transparent;box-shadow:none;min-height:0}
body.is-login main{padding:0}
body.is-login .masthead{background:transparent;position:absolute;left:0;right:0;top:0;z-index:6}
body.is-login footer.site{border-top:0}
body.is-login .acct{display:none}

.hero{position:relative;overflow:hidden;min-height:640px;display:flex;align-items:center;
  background:linear-gradient(168deg,#ECEAEC 0%,var(--ground) 58%,#CFCAD0 100%)}
.hero .in{position:relative;z-index:5;width:100%;max-width:1240px;margin:0 auto;
  padding:96px 24px 130px;text-align:left}
.hero .col{max-width:470px;margin-left:auto}
.hero .lede{margin:0 0 30px}
.hero form{margin:0}
.hero label.fl{text-align:left}
.hero input[type=email]{text-align:left}
.hero .eyebrow{color:var(--teal)}
.hero h1{color:var(--ink);font-size:clamp(34px,4.6vw,58px);line-height:1.05;margin:0 0 18px}
.hero .lede{color:var(--body);max-width:40ch}

/* b-roll bed. No cutouts, so nothing of Sharla is ever cropped or covered:
   the frame simply shows what the camera saw. */
.hero .bed{position:absolute;inset:0;z-index:1;overflow:hidden}
.hero .bed::after{content:"";position:absolute;left:0;right:0;top:0;height:150px;z-index:2;
  background:linear-gradient(to bottom,rgba(243,241,243,.92) 0%,rgba(243,241,243,.55) 46%,rgba(243,241,243,0) 100%)}
.hero .bed video,.hero .bed img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
/* scrim: opaque where the words are, clearing to the right so she stays visible.
   Light, not dark, so the page keeps its warm neutral ground. */
.hero .scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(260deg,
    rgba(242,240,242,.97) 0%,
    rgba(242,240,242,.95) 32%,
    rgba(240,237,240,.74) 52%,
    rgba(238,235,238,.32) 74%,
    rgba(236,233,236,.12) 100%)}
@media (max-width:899px){
  /* No room to run footage behind the words without burying her face under the
     scrim, so on mobile it gets its own band above the navy strip instead. */
  .hero{background:linear-gradient(168deg,#ECEAEC 0%,var(--ground) 100%)}
  .hero .bed{top:auto;bottom:var(--band-h);height:252px;inset:auto 0 var(--band-h) 0}
  .hero .bed::after{display:none}
  .hero .scrim{display:none}
  .hero .bed video,.hero .bed img{object-position:36% top}
}

/* the navy band, crossing their lower third exactly as on the banner */
.hero .band-strip{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--ink);
  min-height:var(--band-h);box-sizing:border-box;
  padding:15px 24px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center}
.hero .band-strip span{font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:var(--t-micro);
  letter-spacing:var(--ls-btn);text-transform:uppercase;color:#fff;white-space:nowrap}
.hero .band-strip span.hi{color:var(--sky)}

/* form: an underline field and one action, not a stack of buttons */
.hero form{max-width:380px}
.hero label.fl{text-align:left;color:var(--soft)}
.hero input[type=email]{width:100%;border:0;border-bottom:1px solid rgba(26,50,92,.42);
  background:transparent;padding:12px 0;font-family:Raleway,Arial,sans-serif;font-weight:300;
  font-size:var(--t-lede);color:var(--ink);margin:0 0 26px;text-align:center}
.hero input[type=email]::placeholder{color:#9AA0A8}
.hero input[type=email]:focus{outline:0;border-bottom-color:var(--ink)}
.hero .btn{display:inline-block;width:auto;min-width:250px;margin:0}
.hero .magic{display:block;margin:20px 0 0;font-family:Oswald,Impact,sans-serif;font-weight:300;
  font-size:11px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--teal);text-decoration:none}
.hero .magic:hover{color:var(--ink)}
.hero .hint{color:var(--soft);font-size:13px;line-height:1.5;max-width:46ch;margin:32px 0 0}
.hero .errorbox{max-width:420px;margin:0 0 24px;text-align:left}

@media (max-width:999px){
  .hero{min-height:0;display:block}
  /* top padding clears the absolutely positioned masthead; bottom clears the pair */
  .hero .in{max-width:none;padding:120px 22px 312px}
  .hero .col{max-width:none;margin-left:0}
  .hero .eyebrow{letter-spacing:var(--ls-label)}
  .hero h1{font-size:clamp(30px,7.4vw,42px)}
  .hero .hint{margin-top:22px}
  .hero .band-strip{bottom:0;padding:13px 18px;gap:9px}
  .hero .band-strip span{font-size:11px;letter-spacing:var(--ls-micro)}
  .hero .band-strip .sep{display:none}
}
@media (max-width:560px){
  .hero .in{padding:112px 20px 306px}
  .hero .eyebrow{letter-spacing:3px}
}

.strip{background:var(--ink);position:relative;z-index:4}
.strip .in{max-width:1200px;margin:0 auto;padding:13px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.strip span{font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:var(--t-micro);letter-spacing:var(--ls-btn);
  text-transform:uppercase;color:#fff;white-space:nowrap}
.strip span.hi{color:var(--sky)}
.strip .sep{opacity:.45}
@media (max-width:560px){ .strip .in{padding:11px 16px;gap:8px} .strip span{font-size:11px;letter-spacing:var(--ls-micro)} .strip .sep{display:none} }
.acct{font-size:var(--t-micro);color:var(--body);text-align:right;line-height:1.5}
.acct button{background:none;border:0;color:var(--btn);font:inherit;text-decoration:underline;cursor:pointer;padding:0}

/* ---------- layout ---------- */
.shell{max-width:1200px;margin:0 auto;background:#fff;min-height:70vh;display:grid;grid-template-columns:1fr}
.side{display:none}
main{padding:26px 20px 44px;min-width:0}
.measure{max-width:var(--measure)}

@media (min-width:1024px){
  .shell{grid-template-columns:288px 1fr;box-shadow:0 0 60px rgba(0,24,38,.10)}
  .side{display:block;border-right:1px solid var(--line);padding:32px 24px 44px;background:var(--ground-soft)}
  .side .stick{position:sticky;top:32px}
  main{padding:34px 44px 64px}
}

/* sidebar */
.side h2{font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:var(--t-micro);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--header);margin:0 0 12px}
.side .navlist{display:flex;flex-direction:column;gap:6px;margin:0 0 26px}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  background:#fff;text-decoration:none;color:inherit;font:inherit}
.navitem:hover{border-color:var(--btn)}
.navitem .n{font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:13px;letter-spacing:var(--ls-micro);line-height:var(--lh-snug);
  text-transform:uppercase;color:var(--delft);flex:1}
.navitem .s{font-size:11px;color:var(--body);line-height:var(--lh-snug)}
.navitem[aria-current=page]{border-color:var(--btn);border-left-width:4px;background:var(--tint)}
.navitem.live{background:var(--btn);border-color:var(--btn)}
.navitem.live .n,.navitem.live .s{color:#fff}
.navitem.locked{background:var(--locked-bg);border-color:var(--locked-bg);pointer-events:none}
.navitem.locked .n,.navitem.locked .s{color:var(--locked-ink)}
.navitem .ok{font-size:11px;color:var(--ok);font-weight:600;letter-spacing:var(--ls-micro)}
.navitem.live .ok{color:#fff}

/* type */
.eyebrow{font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:var(--t-micro);letter-spacing:var(--ls-eyebrow);line-height:var(--lh-snug);
  text-transform:uppercase;color:var(--teal);margin:0 0 10px}
h1{font-family:Raleway,Arial,sans-serif;font-weight:200;font-size:var(--t-display);
  line-height:var(--lh-tight);letter-spacing:.01em;color:var(--ink);margin:0 0 16px;text-wrap:balance}
h2.sub{font-family:Raleway,Arial,sans-serif;font-weight:200;font-size:var(--t-title);line-height:1.16;
  letter-spacing:.01em;color:var(--ink);margin:0 0 14px;text-wrap:balance}
h3{font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:13px;letter-spacing:var(--ls-label);
  line-height:var(--lh-snug);text-transform:uppercase;color:var(--teal);margin:36px 0 14px}
p{margin:0 0 16px;max-width:var(--measure)}
.lede{font-size:var(--t-lede);font-weight:300;line-height:1.55;max-width:60ch}
.caption{font-size:var(--t-small);line-height:1.55;max-width:var(--measure)}
.time{font-family:Oswald,Impact,sans-serif;font-weight:300;letter-spacing:var(--ls-micro);text-transform:uppercase;color:var(--cerulean);font-size:13px;margin:0 0 8px}
.countdown{font-family:Oswald,Impact,sans-serif;font-size:clamp(30px,5vw,42px);letter-spacing:.05em;
  color:var(--delft);font-variant-numeric:tabular-nums;margin:0 0 20px;line-height:1.05}
.countdown small{display:block;font-family:Raleway,Arial,sans-serif;font-size:var(--t-small);letter-spacing:0;
  color:var(--body);text-transform:none;margin-top:4px}
.back{display:inline-flex;align-items:center;gap:7px;font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:var(--t-micro);
  letter-spacing:var(--ls-micro);text-transform:uppercase;color:var(--btn);text-decoration:none;margin:0 0 20px}

/* buttons */
.btn{display:block;width:100%;text-align:center;padding:16px 20px;cursor:pointer;
  font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:14px;letter-spacing:var(--ls-btn);
  text-transform:uppercase;border:1px solid var(--ink);margin:0 0 14px;line-height:var(--lh-snug);
  text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn-primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-primary:hover{background:#02324F;border-color:#02324F}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:#fff}
.btn-sub{display:block;font-family:Raleway,Arial,sans-serif;font-weight:400;font-size:var(--t-small);
  letter-spacing:.01em;text-transform:none;margin-top:4px;opacity:.92}
.btnrow{display:flex;flex-direction:column;gap:0}
@media (min-width:680px){
  .btnrow{flex-direction:row;gap:12px}
  .btnrow .btn{margin-bottom:12px}
}

/* day cards (mobile hub) */
.daylist{display:flex;flex-direction:column;gap:9px;margin:22px 0 0}
.dayrow{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);
  background:#fff;text-decoration:none;color:inherit;font:inherit;transition:border-color .15s}
.dayrow:hover{border-color:var(--btn)}
.dayrow .n{font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:14px;letter-spacing:var(--ls-micro);
  text-transform:uppercase;color:var(--delft);flex:1}
.dayrow .d{font-size:12px;color:var(--body)}
.dayrow.live{background:var(--btn);border-color:var(--btn)}
.dayrow.live .n,.dayrow.live .d{color:#fff}
.dayrow.live .d{font-weight:600}
.dayrow.locked{background:var(--locked-bg);border-color:var(--locked-bg);pointer-events:none}
.dayrow.locked .n,.dayrow.locked .d{color:var(--locked-ink)}
.dayrow.done .n{color:var(--body)}
.pill{font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:11px;letter-spacing:var(--ls-micro);text-transform:uppercase;
  padding:3px 8px;background:#E7F4EC;color:var(--ok)}
.dayrow.live .pill{background:rgba(255,255,255,.22);color:#fff}
@media (min-width:1024px){ .hub-daylist{display:none} }

/* progress */
.progress{display:flex;align-items:center;gap:10px;margin:20px 0 0}
.track{flex:1;height:6px;background:var(--locked-bg)}
.fill{height:6px;background:var(--header);transition:width .3s}
.progress .lab{font-family:Oswald,Impact,sans-serif;font-weight:300;letter-spacing:var(--ls-micro);text-transform:uppercase;
  font-size:11px;color:var(--body);white-space:nowrap}

/* video */
.video{background:#E4E9EE;aspect-ratio:16/9;width:100%;display:flex;align-items:center;justify-content:center;
  margin:0 0 16px;position:relative;cursor:pointer;padding:0;border:1px solid var(--line)}
.video .play{width:0;height:0;border-left:clamp(26px,4vw,40px) solid var(--btn);
  border-top:clamp(17px,2.6vw,26px) solid transparent;border-bottom:clamp(17px,2.6vw,26px) solid transparent;
  transition:transform .15s}
.video:hover .play{transform:scale(1.1)}
.video .tag{position:absolute;left:0;bottom:0;background:var(--btn);color:#fff;
  font-family:Oswald,Impact,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px}
.video.playing{background:#111}
.video.playing .play{display:none}
.vnote{font-size:var(--t-small);margin:-8px 0 20px}
.player{width:100%;margin:0 0 20px;background:#000;border:1px solid var(--line)}
.schedule{max-width:440px;margin:26px 0 8px;border:1px solid var(--line)}
.schedule img{width:100%;height:auto;display:block}
.player video{width:100%;height:auto;display:block;aspect-ratio:16/9;background:#000}

/* desktop 2 column split on day pages */
.cols{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:900px){
  .cols{grid-template-columns:1.5fr .95fr;gap:34px;align-items:start}
  .cols .aside{position:sticky;top:96px}
}

/* quest steps */
.steps{border:1px solid var(--line);border-top:4px solid var(--header);padding:4px 18px;background:#FBFCFD}
.step{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid #EDF1F4;align-items:flex-start}
.step:last-child{border-bottom:0}
.step input{margin:2px 0 0;width:19px;height:19px;accent-color:var(--btn);flex:0 0 auto;cursor:pointer}
.step .txt{font-size:var(--t-body);line-height:1.5}
.step .txt b{color:var(--delft)}
.step .k{display:block;font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:var(--t-micro);
  letter-spacing:var(--ls-micro);line-height:var(--lh-snug);color:var(--header);margin-bottom:5px}
.step.checked .txt{opacity:.55;text-decoration:line-through}

/* golden ticket */
.ticket{background:var(--grad-gold);padding:2px;margin:18px 0 0}
.ticket-in{background:#fff;padding:18px;font-size:var(--t-small);color:var(--delft);line-height:1.5}
.ticket-in b{color:#875300}
.ticket.earned .ticket-in{background:#FFFDF6}

/* cards */
.card{border:1px solid var(--line);padding:20px;margin:0 0 18px;background:#fff}
.card h3{margin-top:0}
.card.gold{border-top:4px solid transparent;border-image:var(--grad-gold) 1}
.summit-art{display:block;margin:0 0 20px;border:1px solid var(--line)}
.summit-art img{width:100%;height:auto;display:block}
.card.tinted{background:var(--tint)}

/* concierge */
.concierge{border-top:1px solid var(--line);margin-top:30px;padding-top:18px}
.side .concierge{border-top:0;margin-top:0;padding-top:0}
.concierge b{display:block;font-size:var(--t-small);color:var(--delft);margin-bottom:5px;font-weight:600}
.concierge span{font-size:13px;max-width:60ch;line-height:1.55;display:block}

/* merge + forms */
.merge{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed var(--btn);
  padding:13px 15px;margin:10px 0 14px;background:var(--tint)}
.merge code{font-family:Oswald,monospace;font-size:var(--t-lede);color:var(--btn);overflow:hidden;text-overflow:ellipsis}
.merge button{font-family:Oswald,Impact,sans-serif;font-weight:400;font-size:11px;letter-spacing:var(--ls-micro);text-transform:uppercase;
  color:#fff;background:var(--btn);padding:8px 12px;border:0;cursor:pointer;flex:0 0 auto}
.merge button:hover{background:var(--btn-hover)}
label.fl{display:block;font-family:Oswald,Impact,sans-serif;font-weight:300;font-size:var(--t-micro);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--body);margin:0 0 6px}
input[type=email],input[type=url]{width:100%;border:2px solid var(--delft);padding:14px;font:inherit;
  font-size:var(--t-body);color:var(--delft);background:#fff;margin:0 0 14px}
input::placeholder{color:#9BA7B4}
.errorbox{border-left:4px solid var(--orange);background:#FEF3EF;padding:15px;margin:0 0 16px;
  font-size:var(--t-small);color:#8A3A1B;line-height:1.55}
.okbox{border-left:4px solid var(--ok);background:#EFF8F3;padding:15px;margin:0 0 16px;
  font-size:var(--t-small);color:#14603F;line-height:1.55}
.hint{font-size:12px;margin:-4px 0 16px}
.hint code{font-family:Oswald,monospace;color:var(--btn)}
.locked-msg{background:var(--locked-bg);padding:20px;margin:16px 0 0;font-size:var(--t-small)}

/* login is single column even on desktop */
.narrow{max-width:460px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--delft);
  color:#fff;padding:13px 22px;font-size:var(--t-small);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer.site{max-width:1200px;margin:0 auto;padding:24px 20px 40px;font-size:var(--t-micro);color:#8A97A5}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div id="rev">
  <div id="revPanel" hidden>
    <span class="lbl">Day</span>
    <div class="row">
      <button data-day="0">Pre</button><button data-day="1">1</button><button data-day="2">2</button>
      <button data-day="3">3</button><button data-day="4">4</button><button data-day="5">5</button>
    </div>
    <span class="lbl">Session</span>
    <button id="tgLive" class="wide">Before the live</button>
    <button id="tgReset" class="wide">Reset</button>
    <span class="note">Preview only. Delete the review block before launch.</span>
  </div>
  <button id="revToggle" aria-expanded="false" aria-controls="revPanel">Review tools</button>
</div>

<header class="masthead">
  <div class="in">
    <a href="#/hub"><img class="logo" src="logo-navy.png" alt="Thrive Academy" width="102"></a>
    <div class="acct" id="acct"></div>
  </div>
</header>
<div class="strip"><div class="in">
  <span>Book 5 Consults in 5 Days</span><span class="sep">|</span>
  <span>September 7 to 11</span><span class="sep">|</span>
  <span class="hi">Live daily 10:00am PT</span>
</div></div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<footer class="site">&copy; 2026 Thrive Academy &middot; Questions? Text (831) 480-1290</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================================
   CHALLENGE CONFIG
   Everything that changes from one challenge to the next lives here and
   nowhere else. To roll the Hub to the next round, edit this block only.
   See "Rolling to the next challenge" in the README.
   ============================================================================ */
var CHALLENGE = {
  id:        "c4",                  /* storage key + access tag. Bump every round. */
  name:      "September 7 to 11",
  tag:       "challenge-sept-2026", /* the GHL tag that grants access */

  /* Local dates. Day 1 is the first live day. */
  days: [
    {n:1, date:"Monday September 7",    short:"Mon Sept 7",  title:"Compelling Consult Name",
     asset:"Compelling Consult Name",   quest:"day1",
     post:"https://giftfromthrive.com/day1", playbook:"https://giftfromthrive.com/name"},
    {n:2, date:"Tuesday September 8",   short:"Tue Sept 8",  title:"Create Intrigue",
     asset:"Create Intrigue",           quest:"std",
     post:"https://giftfromthrive.com/day2", playbook:"https://giftfromthrive.com/intrigue"},
    {n:3, date:"Wednesday September 9", short:"Wed Sept 9",  title:"Trust and Transformation Story",
     asset:"Trust and Transformation Story", quest:"std",
     post:"https://giftfromthrive.com/day3", playbook:"https://giftfromthrive.com/trust"},
    {n:4, date:"Thursday September 10", short:"Thu Sept 10", title:"Inspiring Invitation",
     asset:"Inspiring Invitation",      quest:"std",
     post:"https://giftfromthrive.com/day4", playbook:"https://giftfromthrive.com/invitation"},
    {n:5, date:"Friday September 11",   short:"Fri Sept 11", title:"Success Story",
     asset:"Success Story or 2nd Inspiring Invitation", quest:"std",
     post:"https://giftfromthrive.com/day5", playbook:"https://giftfromthrive.com/success"},
    /* Grand Finale. No Quest and no Playbook, so it renders as a session plus
       the Summit invitation rather than a Quest day.
       TODO Ella: confirm the date. "Day 8" from Mon Sept 7 lands on Mon Sept 14,
       which is after the Sunday replay cut-off, so it needs checking. */
    {n:8, date:"DATE TO CONFIRM",       short:"Day 8",       title:"Grand Finale",
     asset:"", quest:"none", post:"", playbook:""}
  ],

  /* Open every day at once. Set false to gate day by day against the review
     control / the real calendar. */
  unlockAll: true,

  /* Replays come down 9:00pm PT / midnight ET on the Sunday after the challenge.
     Verified against "CHALLENGE WEEK SCHEDULE Sept 7-11.png" in the assets folder.
     ISO with the -07:00 offset so it is unambiguous across time zones. */
  replaysCloseAt: "2026-09-13T21:00:00-07:00",

  links: {
    fbGroup: "https://www.facebook.com/groups/1386366133366597",
    addCal:  "https://apply.clientattractionsummit.com/add-events-page",
    summit:  "https://secure.clientattractionsummit.com/order-form-challenge-step-1",
    optin:   "https://apply.clientattractionsummit.com/challenge-optin-organic-socials",
    /* Zoom carries an embedded passcode, so it is NOT committed to this public
       repo. WordPress injects it. See "Zoom link" in the README. */
    zoom:    window.THRIVE_ZOOM || "#zoom-link-injected-by-wordpress",
    /* Apps Script web app that writes into the Raffle Tickets Tracker.
       Injected by WordPress so the sheet is never named in this repo. */
    questEndpoint: window.THRIVE_QUEST_ENDPOINT || ""
  }
};

var ZOOM=CHALLENGE.links.zoom, SUMMIT=CHALLENGE.links.summit,
    OPTIN=CHALLENGE.links.optin, FBGROUP=CHALLENGE.links.fbGroup,
    ADDCAL=CHALLENGE.links.addCal;
var DAYS=CHALLENGE.days;

/* Replays close on a schedule. Client side this is presentation only; the
   real cut-off has to be enforced by WordPress, same as access. */
function replaysClosed(){
  try{ return new Date() >= new Date(CHALLENGE.replaysCloseAt); }catch(e){ return false; }
}

/* Demo allowlist. In production WordPress gates the page and passes the
   signed-in person in, so this list is never consulted. */
var REGISTERED=["sarah@email.com","ella@thrive-academy.com","sj@thrive-academy.com"];

var S={day:2,live:false,email:null,first:null,progress:{}};
try{var r=localStorage.getItem("thriveHub_"+CHALLENGE.id); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem("thriveHub_"+CHALLENGE.id,JSON.stringify(S));}catch(e){}}
function esc(s){return String(s).replace(/&(?!\w+;)/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cap(e){var n=e.split("@")[0].replace(/[._-]+/g," ").trim();return n.charAt(0).toUpperCase()+n.slice(1);}
function prog(n){return S.progress[n]||(S.progress[n]={steps:[],quest:false});}
function day_(n){for(var i=0;i<DAYS.length;i++){if(DAYS[i].n===n)return DAYS[i];}return null;}
function open_(n){return CHALLENGE.unlockAll || S.day>=n;}
function isQuestDay(d){return d && d.quest && d.quest!=="none";}
function done_(n){var d=day_(n); if(!isQuestDay(d)) return false;
  var p=prog(n); return d.quest==="day1" ? p.quest===true : p.steps.length===4;}
function tickets(){return DAYS.filter(function(d){return isQuestDay(d)&&done_(d.n);}).length;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},2300);}

function concierge(){
  return '<div class="concierge"><b>Questions? Your Challenge Concierge is here for you.</b>'+
   '<span>Text (831) 480-1290 or DM <a href="https://m.me/ThriveAcademy" target="_blank" rel="noopener">m.me/ThriveAcademy</a></span>'+
   '<span>Please include your first and last name so we can find your registration and help you faster.</span></div>';
}

/* ---------------- sidebar (desktop) ---------------- */
function sidebar(){
  if(!S.email) return "";
  var h=location.hash;
  var items='<a class="navitem'+(h==="#/prechallenge"?'" aria-current="page':'')+'" href="#/prechallenge">'+
            '<span class="n">Prepare</span>'+(S.day>=1?'<span class="ok">Done</span>':'')+'</a>';
  items+=DAYS.map(function(d){
    if(!open_(d.n)) return '<span class="navitem locked"><span class="n">Day '+d.n+'</span><span class="s">'+esc(d.short)+'</span></span>';
    var live=(S.day===d.n&&!S.live), cur=(h==="#/day/"+d.n);
    return '<a class="navitem'+(live?' live':'')+'"'+(cur?' aria-current="page"':'')+' href="#/day/'+d.n+'">'+
      '<span class="n">Day '+d.n+'</span>'+
      (live?'<span class="s">Live now</span>':(done_(d.n)?'<span class="ok">&#10003;</span>':'<span class="s">'+esc(d.short)+'</span>'))+'</a>';
  }).join('');
  var t=tickets(), tot=DAYS.filter(function(d){return isQuestDay(d)&&open_(d.n);}).length;
  return '<div class="stick"><h2>Your Challenge</h2><nav class="navlist">'+items+'</nav>'+
    '<h2>Golden Tickets</h2><div class="progress"><span class="lab">'+t+' of '+tot+'</span>'+
    '<span class="track"><span class="fill" style="width:'+(tot?Math.round(t/tot*100):0)+'%"></span></span></div>'+
    '<div style="margin-top:28px">'+concierge()+'</div></div>';
}

function acct(){
  if(!S.email) return '<span>Not signed in</span>';
  return esc(S.email)+'<br><button id="signout">Sign out</button>';
}

/* ---------------- views ---------------- */
function vLogin(err){
  return '<section class="hero">'+
    '<div class="bed"><video autoplay muted loop playsinline preload="metadata" '+
      'poster="hero-poster.jpg" aria-hidden="true"><source src="hero.mp4" type="video/mp4"></video></div>'+
    '<div class="scrim"></div>'+
    '<div class="in"><div class="col">'+
      '<p class="eyebrow">Book 5 Consults in 5 Days</p>'+
      '<h1>Welcome back<br>to the Challenge</h1>'+
      '<p class="lede">Enter the email you registered with and we will take you straight to your Hub.</p>'+
      (err?'<div class="errorbox" style="max-width:420px;margin:0 auto 20px">We do not see a Challenge registration for that email. Check any email we have sent you for the link that signs you in automatically, or <a href="'+OPTIN+'" target="_blank" rel="noopener">register here</a>.</div>':'')+
      '<form id="loginForm" novalidate>'+
        '<label class="fl" for="em">Your email</label>'+
        '<input type="email" id="em" placeholder="you@email.com" autocomplete="email" required>'+
        '<button class="btn btn-primary" type="submit">Enter the Hub</button>'+
        '<a class="magic" href="#/hub" id="magic">Or use my magic link</a>'+
      '</form>'+
      '<p class="hint" style="margin-top:22px">Review note: try sarah@email.com. Anything else shows the error state.</p>'+
    '</div></div>'+
  '<div class="band-strip"><span>September 7 to 11</span><span class="sep">|</span><span class="hi">Live daily 10:00am PT</span></div>'+
  '</section>';
}

function vPre(){
  return '<div class="measure"><p class="eyebrow">You&rsquo;re registered</p>'+
   '<h1>You&rsquo;re in, '+esc(S.first)+'!</h1>'+
   '<div class="player"><video controls preload="none" playsinline poster="welcome-poster.jpg" '+
     'aria-label="Welcome video from Sharla"><source src="welcome.mp4" type="video/mp4">'+
     'Your browser cannot play this video. <a href="welcome.mp4">Download it instead.</a></video></div>'+
   '<p class="lede">The Challenge starts Monday September 7. Take these 2 steps now so you&rsquo;re ready on Day 1.</p>'+
   '<h3>Step 1 &middot; Put it in your calendar</h3>'+
   '<p>We go live at 10:00am PT / 1:00pm ET every day, September 7 to 11.</p>'+
   '<a class="btn btn-outline" href="'+ADDCAL+'" target="_blank" rel="noopener" style="max-width:420px">Add the Challenge to my calendar</a>'+
   '<div class="schedule"><img src="week-schedule.jpg" alt="Challenge week schedule: September 7 Compelling Consult Name, September 8 Create Intrigue, September 9 Trust and Transformation Story, September 10 Inspiring Invitation, September 11 Success Story, September 13 at 9pm Pacific the Challenge videos come down. All live Zoom calls are 10 to 11am Pacific, 1 to 2pm Eastern." width="1000" height="1000"></div>'+
   '<h3>Step 2 &middot; Join the Facebook Group</h3>'+
   '<p>This is where you&rsquo;ll meet the other Champions, post your Quests, and earn your Golden Tickets.</p>'+
   '<p class="caption" style="margin-bottom:2px">The Group will ask for the email you registered with. Here it is:</p>'+
   '<div class="merge" style="max-width:420px"><code>'+esc(S.email)+'</code><button id="copyEmail" type="button">Copy</button></div>'+
   '<a class="btn btn-primary" href="'+FBGROUP+'" id="joinFb" style="max-width:420px">Join the Facebook Group</a>'+
   '<h3>Pre-Challenge Quests</h3>'+
   '<p>Four short Quests are waiting inside the Group. Introduce yourself, meet the other Champions, and say hi to your Concierge.</p>'+
   '<div class="daylist">'+
     ["Show Up For What&rsquo;s Important","Introduce Yourself","Exponentially Increase Your Chances","Stay Engaged"]
     .map(function(t,i){return '<a class="dayrow" href="'+FBGROUP+'" data-fb="1"><span class="n">Quest '+(i+1)+'</span><span class="d">'+t+'</span></a>';}).join('')+
   '</div>'+
   (S.day>=1?'<a class="btn btn-primary" href="#/hub" style="margin-top:26px;max-width:420px">Go to the Challenge Hub</a>':'')+
   concierge()+'</div>';
}

function vHub(){
  var rows=DAYS.map(function(d){
    if(!open_(d.n)) return '<span class="dayrow locked"><span class="n">Day '+d.n+'</span><span class="d">Opens '+esc(d.short)+', 10am PT</span></span>';
    var live=(S.day===d.n&&!S.live), dn=done_(d.n);
    var right=live?'<span class="d">Live now</span>':(dn?'<span class="pill">Complete</span>':'<span class="d">'+esc(d.short)+'</span>');
    return '<a class="dayrow'+(live?' live':'')+(dn?' done':'')+'" href="#/day/'+d.n+'"><span class="n">Day '+d.n+'</span>'+right+'</a>';
  }).join('');
  var t=tickets(), tot=DAYS.filter(function(d){return isQuestDay(d)&&open_(d.n);}).length;
  return '<div class="measure"><p class="eyebrow">Book 5 Consults in 5 Days</p>'+
   '<h1>Your Challenge Hub</h1>'+
   '<p class="lede">Everything you need is here. Pick the day you&rsquo;re on.</p>'+
   '<div class="progress"><span class="lab">'+t+' Golden Ticket'+(t===1?"":"s")+'</span>'+
     '<span class="track"><span class="fill" style="width:'+(tot?Math.round(t/tot*100):0)+'%"></span></span></div>'+
   '<div class="daylist hub-daylist">'+
     '<a class="dayrow done" href="#/prechallenge"><span class="n">Prepare</span><span class="pill">Done</span></a>'+rows+
   '</div>'+
   '<div class="card gold" style="margin-top:30px">'+
     '<a class="summit-art" href="'+SUMMIT+'" target="_blank" rel="noopener">'+
       '<img src="summit-banner.jpg" alt="Client Attraction Summit, September 18 to 20, online" width="1800" height="790">'+
     '</a>'+
     '<h3>Go further than 5 days</h3>'+
     '<p>The Client Attraction Summit is September 18 to 20. Three days with Sharla, live, building the client attraction system behind everything you&rsquo;re learning this week.</p>'+
     '<a class="btn btn-primary" href="'+SUMMIT+'" target="_blank" rel="noopener">Save my seat</a></div>'+
   concierge()+'</div>';
}

function questBlock(d){
  var p=prog(d.n);
  if(d.quest==="day1"){
    return '<h3>Then complete your Day 1 Quest</h3>'+
      '<p>Comment your Compelling Consult Name on our Day 1 Quest post, then claim your prize.</p>'+
      '<a class="btn btn-primary" href="'+d.post+'" target="_blank" rel="noopener">Go to the Day 1 Quest post</a>'+
      '<div class="steps"><div class="step'+(p.quest?' checked':'')+'">'+
      '<input type="checkbox" id="q1"'+(p.quest?' checked':'')+'>'+
      '<label class="txt" for="q1"><span class="k">Day 1 Quest</span>I posted my Compelling Consult Name on the Quest post.</label></div></div>';
  }
  var L=[
   'Encourage <b>5+ Champions</b> by liking and commenting on their posts.',
   'Post your <b>'+d.asset+'</b> on Facebook, Instagram, or LinkedIn.',
   'Share your post link (permalink) in the <b>Day '+d.n+' Quest</b> comments.',
   'Comment on <b>5+ more Champions</b> to help boost each other&rsquo;s visibility.'];
  return '<h3>Then complete your Day '+d.n+' Quest</h3>'+
   '<a class="btn btn-primary" href="'+d.post+'" target="_blank" rel="noopener">Go to the Day '+d.n+' Quest post</a>'+
   '<div class="steps">'+L.map(function(t,i){
     var on=p.steps.indexOf(i)>-1;
     return '<div class="step'+(on?' checked':'')+'"><input type="checkbox" data-step="'+i+'" id="s'+i+'"'+(on?' checked':'')+'>'+
       '<label class="txt" for="s'+i+'"><span class="k">Step '+(i+1)+'</span>'+t+'</label></div>';}).join('')+'</div>';
}

function vDay(n){
  var d=day_(n); if(!d) return vHub();
  if(!open_(n)){
    return '<div class="measure"><a class="back" href="#/hub">&larr; All days</a>'+
     '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p><h1>Not open yet</h1>'+
     '<div class="locked-msg">Day '+n+' opens '+esc(d.short)+' at 10:00am PT. We&rsquo;ll email you the moment it does.</div>'+
     concierge()+'</div>';
  }
  var before=(S.day===n && !S.live), dn=done_(n);
  /* Replays come down on the Sunday. This view returns the same shape as every
     other day view; the surrounding chrome is static markup, not a function. */
  if(!before && replaysClosed()){
    return '<div class="measure"><a class="back" href="#/hub">&larr; All days</a>'+
      '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p>'+
      '<h1>This replay has closed</h1>'+
      '<p class="lede">Replays come down at 9:00pm PT on the Sunday after each Challenge. '+
      'Your Playbook is still yours to keep.</p>'+
      '<a class="btn btn-outline" href="'+d.playbook+'" target="_blank" rel="noopener">Download the Playbook</a>'+
      '<a class="btn btn-primary" href="'+SUMMIT+'" target="_blank" rel="noopener">Save my Summit seat</a>'+
      concierge()+'</div>';
  }

  var media = before
   ? '<p class="time">Live at 10:00am PT / 1:00pm ET</p>'+
     '<p class="countdown" id="cd">02:14:36<small>until we go live</small></p>'+
     '<a class="btn btn-primary" href="'+ZOOM+'" id="joinZoom" target="_blank" rel="noopener">Join the live session</a>'
   : '<button class="video" id="vid" aria-label="Play the Day '+n+' session"><span class="play"></span><span class="tag">Day '+n+' session</span></button>'+
     '<p class="vnote">Watch this video first, then complete your Quest below.</p>';

  var quest = !isQuestDay(d)
   ? '<h3>The Grand Finale</h3>'+
     '<p class="lede">No Quest today. This is where it all comes together.</p>'
   : before
   ? '<h3>Today&rsquo;s Quest</h3><p>Your Quest unlocks when we go live. Stay with me on the call and you&rsquo;ll have it written before we finish.</p>'
   : questBlock(d);

  var ticket = (before || !isQuestDay(d)) ? '' :
   '<div class="ticket'+(dn?' earned':'')+'"><div class="ticket-in">'+
   (dn?'<b>Golden Ticket earned.</b> That&rsquo;s Day '+n+' done. You&rsquo;re in the draw for the Grand Prize: The Client Attraction Summit and 2 Months in Platinum.'
      :'Complete all the steps to earn <b>1 Golden Ticket</b> toward the Grand Prize: The Client Attraction Summit and 2 Months in Platinum.')+
   '</div></div>'+
   (isQuestDay(d) ? '<p class="caption" style="margin-top:14px">Not on Facebook? <a href="#/submit/'+n+'">Submit your post here instead.</a></p>' : '');

  var aside =
   '<div class="aside">'+
     (d.playbook ? '<div class="card"><h3>Today&rsquo;s Playbook</h3>'+
       '<p class="caption">Follow along on the call and write your '+d.asset+' as we go.</p>'+
       '<a class="btn btn-outline" href="'+d.playbook+'" target="_blank" rel="noopener">Download the Playbook</a></div>' : '')+
     '<div class="card gold"><h3>Go further than 5 days</h3>'+
       '<p class="caption">The Client Attraction Summit is September 18 to 20. Three days with Sharla, live.</p>'+
       '<a class="btn btn-primary" href="'+SUMMIT+'" target="_blank" rel="noopener">Save my seat</a></div>'+
   '</div>';

  return '<a class="back" href="#/hub">&larr; All days</a>'+
   '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p>'+
   '<h1>'+d.title+'</h1>'+
   '<div class="cols"><div class="mainCol">'+media+quest+ticket+'</div>'+aside+'</div>'+
   concierge();
}

function vSubmit(n,sent){
  var d=day_(n);
  if(sent) return '<div class="narrow"><a class="back" href="#/day/'+n+'">&larr; Back to Day '+n+'</a>'+
    '<h1>Got it</h1><div class="okbox">Your Day '+n+' Quest is counted. See you tomorrow at 10:00am PT.</div>'+
    '<a class="btn btn-primary" href="#/hub">Back to the Hub</a>'+concierge()+'</div>';
  return '<div class="narrow"><a class="back" href="#/day/'+n+'">&larr; Back to Day '+n+'</a>'+
   '<p class="eyebrow">Day '+n+' &middot; '+esc(d.date)+'</p><h1>Submit your Quest</h1>'+
   '<p>Posted somewhere other than our Facebook Group? Drop the link here and we&rsquo;ll count it toward your Golden Ticket.</p>'+
   '<form id="subForm" novalidate><label class="fl" for="se">Your email</label>'+
   '<input type="email" id="se" value="'+esc(S.email||"")+'" required>'+
   '<label class="fl" for="su">Link to your post</label>'+
   '<input type="url" id="su" placeholder="https://" required>'+
   '<button class="btn btn-primary" type="submit">Count my Quest</button></form>'+concierge()+'</div>';
}

function nudgeBroll(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var v=document.querySelector(".hero .bed video");
  if(v && v.paused){ var p=v.play(); if(p && p.catch) p.catch(function(){}); }
}
["pointerdown","touchstart","keydown"].forEach(function(evt){
  document.addEventListener(evt, nudgeBroll, {once:false, passive:true});
});


/* ---------------- router ---------------- */
function render(keep){
  var y=window.scrollY, h=location.hash||"#/login", html, m;
  if(!S.email && h!=="#/login"){location.hash="#/login";return;}
  document.body.className = (h==="#/login") ? "is-login" : "";
  if(h==="#/login") html=vLogin(false);
  else if(h==="#/prechallenge") html=vPre();
  else if(h==="#/hub") html=vHub();
  else if((m=h.match(/^#\/day\/(\d+)$/))) html=vDay(+m[1]);
  else if((m=h.match(/^#\/submit\/(\d+)$/))) html=vSubmit(+m[1],false);
  else {location.hash = S.day>=1 ? "#/hub" : "#/prechallenge"; return;}
  document.getElementById("main").innerHTML=html;
  document.getElementById("side").innerHTML=sidebar();
  document.getElementById("acct").innerHTML=acct();
  window.scrollTo(0, keep?y:0);
  wire(); syncDemo();
  if(location.hash==="#/login"||location.hash==="") setTimeout(nudgeBroll,60);
}

function wire(){
  var q=function(i){return document.getElementById(i);};
  var so=q("signout"); if(so) so.onclick=function(){S.email=null;S.first=null;save();location.hash="#/login";render();};

  var lf=q("loginForm");
  if(lf) lf.onsubmit=function(e){
    e.preventDefault();
    var v=(q("em").value||"").trim().toLowerCase();
    if(REGISTERED.indexOf(v)>-1){S.email=v;S.first=cap(v);save();location.hash=S.day>=1?"#/hub":"#/prechallenge";render();}
    else{document.getElementById("main").innerHTML=vLogin(true);wire();q("em").value=v;q("em").focus();}
  };
  var mg=q("magic");
  if(mg) mg.onclick=function(e){e.preventDefault();S.email=REGISTERED[0];S.first=cap(REGISTERED[0]);save();
    toast("Logged in from your magic link");location.hash=S.day>=1?"#/hub":"#/prechallenge";render();};

  var ce=q("copyEmail");
  if(ce) ce.onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(S.email).then(function(){toast("Email copied");},function(){toast(S.email);});
    else toast(S.email);
  };
  var jz=q("joinZoom");
  if(jz && ZOOM.charAt(0)==="#") jz.onclick=function(e){e.preventDefault();toast("Zoom link is injected in the production build");};

  Array.prototype.forEach.call(document.querySelectorAll('#joinFb,[data-fb]'),function(a){
    a.onclick=function(e){ if(a.getAttribute("href")==="#/hub"){e.preventDefault();toast("Facebook Group link still to be supplied");} };
  });

  [q("vid")].forEach(function(v){ if(v) v.onclick=function(){
    v.classList.toggle("playing"); toast(v.classList.contains("playing")?"Playing":"Paused"); };});

  var m=location.hash.match(/^#\/day\/(\d+)$/);
  if(m){
    var n=+m[1], p=prog(n), q1=q("q1");
    if(q1) q1.onchange=function(){p.quest=q1.checked;save();render(true);if(p.quest)toast("Golden Ticket earned");};
    Array.prototype.forEach.call(document.querySelectorAll("[data-step]"),function(cb){
      cb.onchange=function(){
        var i=+cb.getAttribute("data-step"), k=p.steps.indexOf(i);
        if(cb.checked&&k<0)p.steps.push(i);
        if(!cb.checked&&k>-1)p.steps.splice(k,1);
        save(); var now=done_(n); render(true); if(now)toast("Golden Ticket earned");
      };
    });
    var cd=q("cd");
    if(cd){
      var t=8076; clearInterval(window._cd);
      window._cd=setInterval(function(){
        if(!document.body.contains(cd)){clearInterval(window._cd);return;}
        if(t>0)t--;
        var p2=function(x){return String(x).padStart(2,"0");};
        cd.firstChild.nodeValue=p2(Math.floor(t/3600))+":"+p2(Math.floor(t%3600/60))+":"+p2(t%60);
      },1000);
    }
  }

  var sf=q("subForm");
  if(sf) sf.onsubmit=function(e){
    e.preventDefault();
    var n=+location.hash.match(/^#\/submit\/(\d+)$/)[1], p=prog(n);
    var btn=sf.querySelector("button[type=submit]");
    var payload={challenge:CHALLENGE.id, day:n,
                 email:(q("se").value||"").trim().toLowerCase(),
                 postUrl:(q("su").value||"").trim()};
    function counted(){
      if(day_(n).quest==="day1")p.quest=true; else p.steps=[0,1,2,3];
      save(); document.getElementById("main").innerHTML=vSubmit(n,true);
      document.getElementById("side").innerHTML=sidebar(); wire();
    }
    var url=CHALLENGE.links.questEndpoint;
    if(!url){ counted(); return; }
    if(btn){ btn.disabled=true; btn.textContent="Sending"; }
    fetch(url,{method:"POST",mode:"cors",
        /* text/plain avoids a CORS preflight, which Apps Script cannot answer */
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload)})
      .then(function(r){ return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function(){ counted(); })
      .catch(function(){
        /* never strand someone mid-Quest: count it locally, say so plainly,
           and let the Concierge reconcile from the tracker */
        counted();
        toast("Saved. If it does not appear, text your Concierge.");
      });
    return;
  };
}

/* ---------------- review bar ---------------- */
function syncDemo(){
  Array.prototype.forEach.call(document.querySelectorAll("#rev [data-day]"),function(b){
    b.setAttribute("aria-pressed",(+b.getAttribute("data-day"))===S.day?"true":"false");});
  var t=document.getElementById("tgLive");
  if(!t) return;                       /* panel removed off production */
  t.setAttribute("aria-pressed",S.live?"true":"false");
  t.textContent=S.live?"After the live":"Before the live";
}
Array.prototype.forEach.call(document.querySelectorAll("#rev [data-day]"),function(b){
  b.onclick=function(){
    S.day=+b.getAttribute("data-day"); save();
    var m=location.hash.match(/^#\/day\/(\d+)$/);
    if(S.day===0) location.hash="#/prechallenge";
    else if(m && +m[1]>S.day) location.hash="#/hub";
    render();
  };
});
var tgL=document.getElementById("tgLive");
if(tgL) tgL.onclick=function(){S.live=!S.live;save();render();};
var tgR=document.getElementById("tgReset");
if(tgR) tgR.onclick=function(){
  S={day:2,live:false,email:null,first:null,progress:{}};save();location.hash="#/login";render();toast("Reset");};

/* Nudge the b-roll into playing. Muted autoplay is allowed everywhere modern,
   but some engines still hold it until the element is settled or the user has
   interacted, and a frozen poster reads as a broken page. Harmless if it is
   already running; the poster is a perfectly good fallback if it never does. */
/* honour reduced-motion: hold the poster frame instead of looping the b-roll */
if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  document.addEventListener("play",function(e){
    var t=e.target;
    if(t && t.tagName==="VIDEO" && t.closest && t.closest(".bed")) t.pause();
  },true);
}
/* ---------------------------------------------------------------------------
   Review tools only exist off production. They shipped to the live domain once
   because removing them was a manual step, so the page now decides for itself.
   Force them on anywhere with ?review=1.
   --------------------------------------------------------------------------- */
var REVIEW_HOSTS=["localhost","127.0.0.1","thriveacademy2026.github.io"];
var showReview = /[?&]review=1/.test(location.search) ||
                 REVIEW_HOSTS.indexOf(location.hostname)>-1 ||
                 location.protocol==="file:";
if(!showReview){
  var revEl=document.getElementById("rev");
  if(revEl && revEl.parentNode) revEl.parentNode.removeChild(revEl);
}

var rt=document.getElementById("revToggle"), rp=document.getElementById("revPanel");
if(rt && rp) rt.onclick=function(){var open=rp.hasAttribute("hidden");
  if(open){rp.removeAttribute("hidden");}else{rp.setAttribute("hidden","");}
  rt.setAttribute("aria-expanded",open?"true":"false");
  rt.textContent=open?"Hide review tools":"Review tools";};

window.addEventListener("hashchange",function(){render();});
render();
})();
</script>
