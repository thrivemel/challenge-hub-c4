<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Setting up your Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&family=Raleway:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#DAD6DA;
    --navy:#1A325C;
    --accent:#00AEEF;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground);
    color:var(--navy);
    font-family:"Raleway",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:48px 24px;
  }
  .logo{width:min(220px,55vw);height:auto;margin-bottom:48px}
  h1{
    font-weight:200;
    font-size:clamp(34px,6vw,52px);
    line-height:1.15;
    margin:0;
  }
  .dots{display:flex;gap:10px;margin-top:36px}
  .dots span{
    width:8px;height:8px;border-radius:50%;
    background:var(--navy);
    opacity:.25;
    animation:pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .strip{height:14px;background:var(--navy)}
  @media (prefers-reduced-motion:reduce){
    .dots span{animation:none;opacity:.6}
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="../logo-navy.png" alt="Thrive Academy">
    <h1>Setting up your Hub</h1>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
  <div class="strip"></div>
</body>
</html>
